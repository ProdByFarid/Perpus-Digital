{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'perpustakaan/css/style.css' %}?v=999">
    <script src="{% static 'perpustakaan/js/script.js' %}" defer></script>
</head>
<body>
    <div class="page-container">
        <div class="left-panel">
            <div class="circle-decoration"></div>
        </div>

        <div class="right-panel">
            <div class="form-box">
                <div class="subtitle">REGISTRASI ANGGOTA</div>
                <h1 class="title">Buat Akun Baru</h1>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert-error">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="input-group">
                        <label>Username / NIM</label>
                        <input type="text" name="username" placeholder="Masukkan Username / NIM" required>
                    </div>

                    <div class="input-group">
                        <label>Email Student</label>
                        <input type="email" name="email" placeholder="nama@student.ac.id" required>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="Buat password" required>
                    </div>

                    <div class="input-group">
                        <label>Konfirmasi Password</label>
                        <input type="password" name="confirm_password" placeholder="Ulangi password" required>
                    </div>

                    <button type="submit" class="btn-submit">Daftar Sekarang</button>
                </form>

                <div class="footer-text">
                    Sudah punya akun? <a href="{% url 'login' %}">Masuk sekarang</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
